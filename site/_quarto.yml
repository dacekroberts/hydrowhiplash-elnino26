project:
  type: website
  output-dir: _site
  resources:
    - "fonts/*"
    - "libs/*"
    - "robots.txt"
    - "preview.png"
    - "film/*"

website:
  title: "El Niño and the 2027 fire season"
  site-url: "https://hydrowhiplash.dacekroberts.dev"
  # The sentence under a card's headline, on every page: the banner's line.
  description: "Does an El Niño winter say how much the next fire season will burn?"
  # The card a link to the site shows. preview.png is written by
  # `python -m src.banner` (the "site" layout: the question beside the map
  # of the seven regions).
  open-graph: true
  twitter-card: true
  page-footer: "Text and figures © 2026 Dace Roberts, all rights reserved. Code: MIT licence."
  navbar:
    left:
      - href: index.qmd
        text: Overview
      - href: map.qmd
        text: Map
      - href: tracker.qmd
        text: Tracker
      - href: methods.qmd
        text: Methods and Limitations
      - href: flowchart.qmd
        text: Flowchart

author: "Dace Roberts"

# Every page's card shows the same picture. Without this, Quarto takes a
# page's first figure, and three pages start with an SVG, which link
# previews do not draw.
image: preview.png
image-alt: "Does an El Niño winter say how much the next fire season will burn? A map of the seven study regions, from Alaska and Yukon down the coast to Southern California, beside the site's address."

# theme/ is written by `python -m src.theme` from theme/tokens.json; edit the
# tokens, not the files in it.
format:
  html:
    theme:
      light: theme/light.scss
      dark: theme/dark.scss
    respect-user-color-scheme: true
    include-in-header:
      - theme/fonts.html
      - _rights.html
    toc: true
