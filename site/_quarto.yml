project:
  type: website
  output-dir: _site

website:
  title: "El Niño and the 2027 fire season"
  page-footer: "Text and figures © 2026 Dace Roberts, all rights reserved. Code: MIT licence."
  navbar:
    left:
      - href: index.qmd
        text: Overview
      - href: methods.qmd
        text: Methods and limitations

author: "Dace Roberts"

# theme/ is written by `python -m src.theme` from theme/tokens.json; edit the
# tokens, not the files in it.
format:
  html:
    theme:
      light: theme/light.scss
      dark: theme/dark.scss
    respect-user-color-scheme: true
    include-in-header: theme/fonts.html
    toc: true
